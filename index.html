function setp(p,v){const a=p.split("|");let o=S;for(let i=0;i<a.length-1;i++)o=o[a[i]]??={};o[a[a.length-1]]=v}
const cb=(p,l="")=>`<label><input type="checkbox" data-f="${p}" data-r ${g(p)?"checked":""}> <span>${l}</span></label>`;
const ta=(p,ph="")=>`<textarea data-f="${p}" placeholder="${E(ph)}">${E(g(p))}</textarea>`;
const tx=(p,ph="")=>`<input data-f="${p}" value="${E(g(p))}" placeholder="${E(ph)}">`;
const sl=(p,o,r)=>`<select data-f="${p}" ${r?"data-r":""}>${o.map(x=>`<option${x===g(p)?" selected":""}>${E(x)}</option>`).join("")}</select>`;
const bar=(a,b)=>`<div class="bar"><i style="width:${b?Math.round(100*a/b):0}%"></i></div>`;
const weekDone=w=>TK.every((_,k)=>S.wd[w.id]?.[k]),wkAny=w=>TK.some((_,k)=>S.wd[w.id]?.[k]);
const cw=()=>{const n=Math.floor((new Date(td())-new Date(S.start))/6048e5)-(+S.pause||0);return isNaN(n)?0:Math.max(0,Math.min(W.length-1,n))};
const canDone=i=>{const q=S.ph[i]||{};return q.pass&&(q.ev||"").trim()&&W.filter(w=>w.i===i).every(weekDone)&&P[i].m.every((_,k)=>S.ms[i+"."+k]?.d)};
const pst=i=>{const q=S.ph[i]||{},ws=W.filter(w=>w.i===i),ev=(q.ev||"").trim();if(q.done)return"Completed";if(q.block)return"Blocked";if(q.pass)return"Assessment passed";if(ws.every(weekDone)&&!ev)return"Needs evidence";return ws.some(wkAny)||ev?"In progress":"Not started"};
const sc=s=>s==="Completed"||s==="Assessment passed"?"ok":s==="Blocked"?"er":s==="Needs evidence"?"wn":"";
const resList=i=>P[i].r.map((r,k)=>({id:i+"."+k,r})).concat(S.cr.map((c,k)=>({c,id:"c"+k,r:[c.t,c.p,c.u,c.ty,c.dur,c.cert]})).filter(x=>x.c.i===i));
const link=u=>/^https?:\/\//i.test(u||"")?`<a href="${E(u)}" target="_blank" rel="noopener noreferrer">${E(u.replace(/^https?:\/\//,"").slice(0,45))}</a>`:"";
const V={};
V.lib=()=>{const q=ui.q.toLowerCase();let tot=0,dn=0;P.forEach((_,i)=>resList(i).forEach(x=>{tot++;if(S.r[x.id])dn++}));
let h=`<h1>CloudMax — Free Learning Library</h1><p class="mu">Remote cloud infrastructure and architecture engineer path, 2026 → 2030. ${dn}/${tot} resources finished. Video courses and free Anthropic Academy certificate courses; no documentation as core resources. Paid certificates are never presented as free. <b>Not yet researched:</b> DNS/TLS deep-dive, Prometheus/Grafana, SRE practice, pytest video, RAG/evals, system-design prep, OpenAI certificates — use “+ Add resource” or ask for another research pass.</p>${bar(dn,tot)}
<div class="row"><input id="q" placeholder="Search resources…" value="${E(ui.q)}" style="max-width:260px"><button class="s" data-a="addres">+ Add resource (edX, Udemy free course, etc.)</button></div>`;
P.forEach((p,i)=>{const rs=resList(i).filter(x=>!q||(x.r[0]+x.r[1]+p.n).toLowerCase().includes(q));if(!rs.length)return;const s=pst(i);
h+=`<h2>Phase ${i}: ${E(p.n)} <span class="b ${sc(s)}">${s}</span> <span class="mu">${p.h}</span></h2><div class="g">`+rs.map(x=>{const r=x.r,v=S.ver[x.id],th=S.th[x.id]||(r[7]?"https://i.ytimg.com/vi/"+r[7]+"/hqdefault.jpg":"");
return `<div class="cd"><div class="th" style="background:linear-gradient(135deg,${p.c},#0f172a)">${E(String(r[1]).split(/[ /(]/)[0].slice(0,4).toUpperCase())}${th?`<img src="${E(th)}" alt="" loading="lazy" onerror="this.remove()">`:""}<span class="b tp">${E(r[3])}</span></div><div class="bd"><b>${E(r[0])}</b><div class="mu">${E(r[1])} · ${E(r[4])}</div><div class="mu">Cost: ${E(r[6]||"Free to learn (provider-stated, unverified)")}</div><div class="mu">Certificate: ${E(r[5])}</div><div class="mu ${r[8]==="v"?"ok":""}" style="border:0">${r[8]==="v"?"Checked 2026-11-21: title, channel and length matched public indexes. Not watched; content judged from descriptions/chapter lists.":r[8]==="c"?"Course name listed in the Anthropic Academy catalog (checked 2026-11-21 via guides; not opened by me). Open the catalog and search the title.":r[8]==="p"?"Partly checked 2026-11-21: course exists; direct video link not confirmed.":v?`Checked by you on ${E(v)}`:"Unverified — not checked"}${r[8]&&v?` · you re-checked ${E(v)}`:""}</div><div class="row" style="margin-top:6px">${cb("r|"+x.id,"Finished")}${/^https?:/.test(r[2]||"")?`<a href="${E(r[2])}" target="_blank" rel="noopener noreferrer">Open ↗</a>`:""}<button class="s" data-a="verify" data-k="${x.id}">${v?"Unmark":"I checked it"}</button><button class="s" data-a="th" data-k="${x.id}" title="Set thumbnail image URL">🖼</button></div></div></div>`}).join("")+"</div>"});return h};
V.dash=()=>{const w=W[cw()],p=P[w.i],un=S.opp.filter(o=>!CLOSED.includes(o.st)),ev=CP.filter((_,i)=>S.comp[i]?.ev&&LV.indexOf(S.comp[i]?.lv)>=2).length;
const up=[];un.forEach(o=>{if(o.dl&&dd(o.dl)>=0&&dd(o.dl)<=30)up.push([o.dl,"Deadline: "+o.co+" — "+o.ti]);if(o.fu&&dd(o.fu)>=0&&dd(o.fu)<=30)up.push([o.fu,"Follow-up: "+o.co])});up.sort();
const nm=p.m.map((x,k)=>[x,k]).filter(([x,k])=>!S.ms[w.i+"."+k]?.d).slice(0,3),ct=S.ct[w.id]||[],li=S.li[w.id]||{};
const vf=un.filter(o=>o.el!==EL[0]&&o.el!==EL[2]);
return `<h1>Dashboard</h1><div class="row mu"><label>Plan start <input type="date" data-f="start" data-r value="${E(S.start)}"></label><label>Weeks paused (exams) <input type="number" min="0" style="width:70px" data-f="pause" data-r value="${+S.pause||0}"></label></div>${dd(S.start)>0?`<p class="wn">Plan starts in ${dd(S.start)} days; showing Week 1.</p>`:""}
<div class="g2" style="margin-top:10px"><div class="cd bd"><h3>Now</h3><b>Phase ${w.i}: ${E(p.n)}</b> <span class="b ${sc(pst(w.i))}">${pst(w.i)}</span><div>Week ${w.n} of ${W.length}: ${E(w.t)}</div>${bar(W.filter(x=>weekDone(x)).length,W.length)}<div class="mu">${W.filter(weekDone).length}/${W.length} weeks fully complete. Target 10–12 h/week.</div></div>
<div class="cd bd"><h3>This week's tasks</h3>${TK.map((t,k)=>cb("wd|"+w.id+"|"+k,t+": "+E(w.t))).join("")}${ct.map((c,k)=>`<div class="row">${cb("ct|"+w.id+"|"+k+"|d",E(c.t))}<button class="s" data-a="deltask" data-k="${w.id}|${k}">✕</button></div>`).join("")}<div class="row" style="margin-top:6px"><input id="ntx" placeholder="Add a task" style="max-width:200px"><button class="s" data-a="addtask" data-k="${w.id}">Add</button></div></div>
<div class="cd bd"><h3>Project: next milestones</h3><div class="mu">${E(p.proj)}</div>${nm.length?nm.map(([x,k])=>cb("ms|"+w.i+"."+k+"|d",E(x))).join(""):"<div class='mu'>All milestones ticked — add evidence on the Phases page.</div>"}</div>
<div class="cd bd"><h3>Deadlines & follow-ups (30 days)</h3>${up.length?up.map(u=>`<div>${E(u[0])} · ${E(u[1])}</div>`).join(""):"<div class='mu'>None recorded. Add opportunities on the Opportunities page.</div>"}</div>
<div class="cd bd"><h3>Needs eligibility verification</h3>${vf.length?vf.map(o=>`<div>${E(o.co)} — ${E(o.ti)} <span class="b wn">${E(o.el||"Unknown")}</span></div>`).join(""):"<div class='mu'>Nothing pending.</div>"}</div>
<div class="cd bd"><h3>Competencies with evidence</h3><b>${ev}/12</b> at “Demonstrated” or above with evidence attached. Self-rating alone doesn’t count.</div>
<div class="cd bd"><h3>LinkedIn this week</h3><div>${E(p.l[w.j%p.l.length])}</div><div class="mu">Status: ${E(li.s||"planned")}</div></div></div>
<h2>Weekly review — Week ${w.n}</h2><div class="cd bd">${["What did I actually build?","What did I learn that I can explain without assistance?","What failed, and how did I debug it?","What evidence did I publish?","What is the most important next task?","Did my academic workload require adjusting the plan?"].map((q,k)=>`<div><b>${q}</b>${ta("rv|"+w.id+"|"+k)}</div>`).join("")}</div>`};
V.ph=()=>{const i=ui.p,p=P[i],q=S.ph[i]||{},ws=W.filter(w=>w.i===i),s=pst(i);
return `<h1>Phases & projects</h1><div class="row">${P.map((x,k)=>`<button class="chip ${k===i?"on":""}" data-a="ph" data-k="${k}">${k}. ${E(x.n)} <span class="b ${sc(pst(k))}">${pst(k)}</span></button>`).join("")}</div>
<h2>Phase ${i}: ${E(p.n)} <span class="b ${sc(s)}">${s}</span></h2><div class="cd bd">${[["Objectives",p.obj],["Prerequisites",p.pre],["Estimated hours",p.h],["Practical exercises",p.pr],["Project",p.proj],["Assessment criteria",p.as],["Required evidence",p.ev],["AI-assisted practice",p.ai],["Exit requirement",p.ex]].map(([a,b])=>`<div><b>${a}:</b> ${E(b)}</div>`).join("")}</div>
<h2>Weeks</h2><div class="cd bd">${ws.map(w=>`<div class="row"><span style="min-width:230px">Wk ${w.n}: ${E(w.t)}</span>${TK.map((t,k)=>cb("wd|"+w.id+"|"+k,t)).join("")}</div>`).join("")}</div>
<h2>Project milestones & evidence</h2><div class="cd bd">${p.m.map((m,k)=>`<div class="row">${cb("ms|"+i+"."+k+"|d",E(m))}<input data-f="ms|${i}.${k}|e" value="${E(S.ms[i+"."+k]?.e)}" placeholder="Evidence link / note" style="flex:1;min-width:180px"></div>`).join("")}</div>
<h2>Phase evidence & assessment</h2><div class="cd bd"><div class="mu">Required: ${E(p.ev)}</div>${ta("ph|"+i+"|ev","Links to repo, tests, demo, write-up…")}${cb("ph|"+i+"|pass","Assessment passed (I met the assessment criteria)")}${cb("ph|"+i+"|block","Blocked")}<div class="row" style="margin-top:8px">${q.done?`<button class="s" data-a="reopen" data-k="${i}">Reopen phase</button>`:`<button class="p" data-a="done" data-k="${i}" ${canDone(i)?"":"disabled"}>Mark phase completed</button><span class="mu">Needs: all weeks + milestones ticked, evidence text, assessment passed.</span>`}</div></div>`};
V.opp=()=>{const o=ui.edit>=0?S.opp[ui.edit]:{},v=ui.of;
const f=x=>{const open=!CLOSED.includes(x.st);return v==="all"||(v==="rc"&&x.ar===AR[0]&&x.el===EL[0]&&open)||(v==="ru"&&x.ar===AR[0]&&x.el!==EL[0]&&x.el!==EL[2]&&open)||(v==="hy"&&x.ar!==AR[0])||(v==="yr"&&x.ty==="Internship")||(v==="cl"&&x.dl&&open&&dd(x.dl)>=0&&dd(x.dl)<=14)||(v==="sv"&&x.st==="Saved")||(v==="sb"&&SUB.includes(x.st))||(v==="cx"&&CLOSED.includes(x.st))};
let L=S.opp.map((x,k)=>({x,k})).filter(a=>f(a.x));L.sort((a,b)=>v==="yr"?String(a.x.gy).localeCompare(String(b.x.gy)):String(a.x.dl||"9").localeCompare(String(b.x.dl||"9")));
return `<h1>Opportunities</h1><p class="mu">Remote status and India eligibility are separate fields. Never assume “remote” means India-eligible. Nothing here is pre-filled: add only openings you found and sources you read. Browser reminders aren’t reliable when the app is closed — check the Dashboard regularly. (Calendar view: Version 2; sorted deadline list now.)</p>
<div class="row">${VIEWS.map(a=>`<button class="chip ${v===a[0]?"on":""}" data-a="of" data-k="${a[0]}">${a[1]}</button>`).join("")}</div><div style="margin-top:10px">${L.length?L.map(({x,k})=>`<div class="cd bd" style="margin-bottom:8px"><div class="row"><b>${E(x.co)}</b> — ${link(x.url)||E(x.ti)} ${x.url?"("+E(x.ti)+")":""}<span class="b">${E(x.ty)}</span><span class="b">${E(x.ar)}</span><span class="b ${x.el===EL[0]?"ok":x.el===EL[2]?"er":"wn"}">${E(x.el)}</span><span class="b">${E(x.st)}</span></div><div class="mu">${E(x.fam)} · ${E(x.cty)} · Grad: ${E(x.gy||"unknown")} · Opens: ${E(x.op||"unknown")} · Deadline: ${x.dl?E(x.dl)+" ("+dd(x.dl)+"d)":"unknown"} · Dates: ${E(x.dt||"unknown")} · Return offer: ${E(x.rp)}</div><div class="mu">Eligibility source: ${E(x.src||"none recorded")} · verified ${E(x.vd||"never")} · follow-up ${E(x.fu||"none")}</div><div class="mu">${E(x.deg)} | ${E(x.sk)} | ${E(x.nt)}</div><div class="row"><button class="s" data-a="oedit" data-k="${k}">Edit</button><button class="s" data-a="odel" data-k="${k}">Delete</button></div></div>`).join(""):'<div class="cd bd mu">No opportunities in this view yet.</div>'}</div>
<h2>${ui.edit>=0?"Edit":"Add"} opportunity</h2><div class="cd bd"><div class="fg">${F.map(([k,l,t])=>`<div><span>${l}</span>${Array.isArray(t)?`<select id="f_${k}">${t.map(z=>`<option${z===(o[k]||(k==="el"?EL[3]:""))?" selected":""}>${E(z)}</option>`).join("")}</select>`:t==="date"?`<input type="date" id="f_${k}" value="${E(o[k])}">`:`<input id="f_${k}" value="${E(o[k])}">`}</div>`).join("")}</div><div class="row" style="margin-top:8px"><button class="p" data-a="osave">${ui.edit>=0?"Save changes":"Add"}</button>${ui.edit>=0?'<button class="s" data-a="ocancel">Cancel</button>':""}</div></div>`};
V.li=()=>{const i=ui.lp,p=P[i];return `<h1>LinkedIn planner</h1><p class="mu">One idea per week. Post only real work; never claim a project is finished before it is. Skip freely during exams.</p><div class="row">${P.map((x,k)=>`<button class="chip ${k===i?"on":""}" data-a="lp" data-k="${k}">${k}. ${E(x.n)}</button>`).join("")}</div>`+W.filter(w=>w.i===i).map(w=>`<div class="cd bd" style="margin-top:8px"><b>Wk ${w.n}: ${E(w.t)}</b><div>Angle: ${E(p.l[w.j%p.l.length])}</div><div class="mu">Attach evidence:</div>${tx("li|"+w.id+"|ev","Repo, test output, benchmark, screenshot link")}<details><summary>Outline</summary><ol class="mu"><li>Goal / problem</li><li>What I tried and what failed</li><li>What I can now explain</li><li>Evidence link</li><li>Next step</li></ol></details>${ta("li|"+w.id+"|dr","Optional draft")}<div class="row"><span class="mu">Status</span>${sl("li|"+w.id+"|s",["planned","drafted","published","skipped"])}</div></div>`).join("")};
V.comp=()=>`<h1>Competencies</h1><p class="mu">Levels above “Learning” need evidence (link, test result, code review, assessment). Self-rating alone is not accepted.</p>`+CP.map((c,i)=>`<div class="cd bd" style="margin-bottom:8px"><b>${i+1}. ${c}</b><div class="fg"><div><span>Level</span>${sl("comp|"+i+"|lv",LV)}</div><div><span>Evidence links</span>${tx("comp|"+i+"|ev")}</div><div><span>Project / assessment</span>${tx("comp|"+i+"|pj")}</div><div><span>Last demonstrated</span><input type="date" data-f="comp|${i}|dt" value="${E(g("comp|"+i+"|dt"))}"></div><div><span>Next action</span>${tx("comp|"+i+"|nx")}</div></div></div>`).join("");
V.bak=()=>`<h1>Backup & notes</h1><div class="row"><button class="p" data-a="exp">Export JSON</button><button class="s" data-a="impb">Import JSON</button><button class="s" data-a="rst">Erase all data</button></div><h2>Limitations</h2><ul><li>Data lives in this browser only (localStorage). Export backups regularly.</li><li>Resources marked “Checked 2026-11-21” were matched by title/channel/length on public indexes; I did not watch them. Your own “I checked it” stamps are separate. The app cannot check URLs or live job openings.</li><li>Thumbnails load from YouTube (needs internet); a coloured tile shows if one can’t load.</li><li>No AI features, notifications or calendar yet. Internship-to-offer module is Version 2.</li></ul>`;
const NAV=[["lib","▶","Library"],["dash","◧","Dashboard"],["ph","≣","Phases & projects"],["opp","✉","Opportunities"],["li","in","LinkedIn"],["comp","✓","Competencies"],["bak","⇅","Backup"]];
function R(){$("nv").className=ui.nv?"c":"";$("nv").innerHTML=`<button data-a="nav">☰<span class="l"> <b>CloudMax</b></span></button>`+NAV.map(([k,i,l])=>`<button class="${ui.pg===k?"on":""}" data-a="pg" data-k="${k}"><span>${i}</span><span class="l">${l}</span></button>`).join("");$("app").innerHTML=V[ui.pg]()}
$("app").onchange=e=>{const t=e.target;if(t.id==="q"){ui.q=t.value;return R()}const f=t.dataset.f;if(!f)return;const v=t.type==="checkbox"?t.checked:t.value;
if(/^comp\|\d+\|lv$/.test(f)&&LV.indexOf(v)>=2&&!(g(f.replace("lv","ev"))||"").trim()){alert("Add evidence (link, test result, review) before claiming this level.");return R()}
setp(f,v);save();if("r"in t.dataset)R()};
$("app").onclick=$("nv").onclick=e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,k=b.dataset.k;
if(a==="pg"){ui.pg=k}else if(a==="nav"){ui.nv=!ui.nv}else if(a==="ph"){ui.p=+k}else if(a==="lp"){ui.lp=+k}else if(a==="of"){ui.of=k}
else if(a==="verify"){if(S.ver[k])delete S.ver[k];else S.ver[k]=td()}
else if(a==="th"){const u=prompt("Thumbnail image URL (https://…), blank to clear:");if(u===null)return;if(u&&!/^https?:\/\//i.test(u))return alert("Must start with http(s)://");if(u)S.th[k]=u;else delete S.th[k]}
else if(a==="addres"){const t=prompt("What will you learn from it? (title)");if(!t)return;const i=+prompt("Phase number 0–9?");if(!(i>=0&&i<=9))return alert("Invalid phase");const u=prompt("Official URL:")||"";if(u&&!/^https?:\/\//i.test(u))return alert("URL must start with http(s)://");S.cr.push({i,t,p:prompt("Provider/author:")||"Unknown",u,ty:prompt("Type (course, book, docs…):")||"Resource",dur:prompt("Estimated duration:")||"unknown",cert:prompt("Certificate? Say free / paid / none / unknown:")||"unknown"})}
else if(a==="addtask"){const v=$("ntx").value.trim();if(!v)return;(S.ct[k]??=[]).push({t:v,d:false})}
else if(a==="deltask"){const[w,i]=k.split("|");S.ct[w].splice(+i,1)}
else if(a==="done"){if(!canDone(+k))return;(S.ph[k]??={}).done=true}else if(a==="reopen"){S.ph[k].done=false}
else if(a==="oedit"){ui.edit=+k}else if(a==="ocancel"){ui.edit=-1}
else if(a==="odel"){if(!confirm("Delete this opportunity? This cannot be undone."))return;S.opp.splice(+k,1);ui.edit=-1}
else if(a==="osave"){const o={};F.forEach(([x])=>o[x]=$("f_"+x).value.trim());if(!o.co||!o.ti)return alert("Company and job title are required.");if(o.url&&!/^https?:\/\//i.test(o.url))return alert("URL must start with http(s)://");if(o.el===EL[0]&&(!o.src||!o.vd))return alert("“Confirmed eligible” needs a source and a verification date.");if(ui.edit>=0)S.opp[ui.edit]=o;else S.opp.push(o);ui.edit=-1}
else if(a==="exp"){const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([JSON.stringify({app:"cloudmax",v:1,at:new Date().toISOString(),data:S},null,1)],{type:"application/json"}));l.download="cloudmax-backup-"+td()+".json";l.click();return}
else if(a==="impb"){$("imp").click();return}
else if(a==="rst"){if(!confirm("Erase ALL CloudMax data in this browser? Export a backup first."))return;S=S0()}
save();R()};
$("imp").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{let o;try{o=JSON.parse(r.result)}catch(x){return alert("Not valid JSON")}
const d=o&&o.data;if(!o||o.app!=="cloudmax"||!d||typeof d!=="object")return alert("Not a CloudMax backup");
if(d.opp&&!(Array.isArray(d.opp)&&d.opp.every(x=>x&&typeof x==="object")))return alert("Invalid opportunities");if(d.cr&&!Array.isArray(d.cr))return alert("Invalid resources");if(d.start&&!/^\d{4}-\d\d-\d\d$/.test(d.start))return alert("Invalid start date");
for(const k of["r","ver","th","wd","ct","ph","ms","li","rv","comp"])if(d[k]&&(typeof d[k]!=="object"||Array.isArray(d[k])))return alert("Invalid field: "+k);
if(!confirm("Replace current data with this backup?"))return;S=Object.assign(S0(),d);save();R()};r.readAsText(f);e.target.value=""};
R();
</script></body></html>
